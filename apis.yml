name: Fresha
description: >-
  Fresha is a marketplace and business-management platform for the beauty and
  wellness industry — salons, barbershops, spas, medspas and independent
  professionals. Consumers discover and instantly book appointments across 120+
  countries (over one billion appointments booked), while businesses run
  scheduling and calendar, client management, point of sale, integrated card and
  online payments, automated messaging (SMS, WhatsApp and email) and marketing.
  Fresha is subscription-free for businesses, monetizing through payment
  processing, marketing add-ons and new-client marketplace fees, and is backed by
  investors including Partech and KKR. Fresha does not currently publish a public
  developer API or developer portal; its public engineering footprint is the
  open-source @fresha Web API tooling on GitHub (OpenAPI lint, diff and codegen).
